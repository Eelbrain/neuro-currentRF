name: Build wheels

# Adapted from Eelbrain

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build sdist and wheel
        run: pipx run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist/*

  test-sdist:
    name: Test sdist
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # for env-dev.yml
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist
      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniforge-version: latest
          environment-file: env-dev.yml
          activate-environment: ncrf
          auto-activate-base: false
      - name: Install sdist
        shell: bash -el {0}
        run: |
          pip install "$(ls dist/*.tar.gz)[test]"
          rm -rf ncrf
      - name: Check version
        shell: bash -el {0}
        run: |
          python -c "import ncrf; v = ncrf.__version__; assert v != '0.0.0' and v[0].isdigit(), f'Bad version: {v!r}'"
      - name: Run tests
        shell: bash -el {0}
        run: pytest -m "not slow" -rsx -v --pyargs ncrf

  pre-publish:
    runs-on: ubuntu-latest
    needs: [test-sdist]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: ls -lR dist/
      - run: pipx run twine check dist/*

  publish:
    runs-on: ubuntu-latest
    environment: "Package deployment"
    permissions:
      id-token: write  # for trusted publishing
    needs: [pre-publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: ls -lR dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
