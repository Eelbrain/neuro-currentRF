name: Python Package using Conda on linux and macos

on:
  push:
    branches:
      - master
      - maint*
  pull_request:
    branches: [ "master" ]

jobs:
  build-posix:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10']
        include:
          - os: ubuntu-latest
            cv: 1
          - os: macos-latest
            cc: 1

    steps:
    - uses: actions/checkout@v4
    - name: Install Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        miniforge-version: latest
        python-version: ${{ matrix.python-version }}
        environment-file: env-dev.yml
        activate-environment: ncrf
        auto-activate-base: false
    - name: build Neuro-currentRF
      shell: bash -el {0}
      run: |
        python -m pip install .[test]
        rm -rf ncrf
    # The whole test-data directory is cached: fetch_dataset() replaces it when
    # version.txt is missing or outdated, so caching subjects/ alone would not survive.
    - name: Locate test data
      id: testdata
      shell: bash -el {0}
      run: |
        python -c "from pathlib import Path; import ncrf.tests.fetch as f; print(f'path={Path(f.__file__).resolve().parents[2] / f.folder_name}'); print(f'release={f.RELEASE}')" >> "$GITHUB_OUTPUT"
    - name: Cache test data
      id: cache-testdata
      uses: actions/cache@v4
      with:
        path: ${{ steps.testdata.outputs.path }}
        key: ncrf-testing-data-${{ steps.testdata.outputs.release }}-${{ runner.os }}
    - if: steps.cache-testdata.outputs.cache-hit != 'true'
      name: Fetch test data, including fsaverage
      shell: bash -el {0}
      run: |
        python -c "from ncrf.tests.fetch import load; load('fwd_sol', geometry=True)"
    - if: ${{ matrix.cc }}
      name: Test with pytest and code-cov
      shell: bash -el {0}
      run: |
        pytest --cov --cov-report=xml --pyargs ncrf  # namespace vs module import?
    - if: ${{ matrix.cc }}
      name: Upload coverage to Codecov  
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - if: ${{ matrix.cv }}
      name: Test with pytest and cv
      shell: bash -el {0}
      run: |
        pytest --crossvalidation=True --pyargs ncrf
