name: Python Package using Conda on windows

on:
  push:
    branches:
      - master
      - maint*
  pull_request:
    branches: [ "master" ]

jobs:
  build-windows-latest:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: false
        environment-file: env-dev.yml
        activate-environment: ncrf
    - name: build Neuro-currentRF
      shell: bash -el {0}
      run: |
        pip install -e .[test]
    # The whole test-data directory is cached: fetch_dataset() replaces it when
    # version.txt is missing or outdated, so caching subjects/ alone would not survive.
    - name: Locate test data
      id: testdata
      shell: bash -el {0}
      run: |
        python -c "from pathlib import Path; import ncrf.tests.fetch as f; print(f'path={Path(f.__file__).resolve().parents[2] / f.folder_name}'); print(f'release={f.RELEASE}')" >> "$GITHUB_OUTPUT"
    - name: Cache test data
      id: cache-testdata
      uses: actions/cache@v4
      with:
        path: ${{ steps.testdata.outputs.path }}
        key: ncrf-testing-data-${{ steps.testdata.outputs.release }}-${{ runner.os }}
    - if: steps.cache-testdata.outputs.cache-hit != 'true'
      name: Fetch test data, including fsaverage
      shell: bash -el {0}
      run: |
        python -c "from ncrf.tests.fetch import load; load('fwd_sol', geometry=True)"
    - name: Test with pytest
      shell: bash -el {0}
      run: |
        pytest  --crossvalidation=True
